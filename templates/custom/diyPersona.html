			<div id="picGoesHere" style="height:100%; width:20%; float:left;"></div>
			<div class="bullets" style="height:100%; width:80%; float:right; color:black;">
				<div id="diyPersonaEditor">
					<label for="diyPersonaNameInput"><b>Persona name</b></label><br>
					<input id="diyPersonaNameInput" type="text" placeholder="ex: Maya" style="width:95%; margin-top:4px; margin-bottom:10px;"><br>
					<label for="diyPersonaDescriptionInput"><b>Persona description</b></label><br>
					<textarea id="diyPersonaDescriptionInput" rows="6" style="width:95%; margin-top:4px;" placeholder="ex: Maya is a first-generation college student applying for financial aid."></textarea>
				</div>
				<div id="diyPersonaSummary" hidden>
					<div style="margin-bottom:8px;"><b id="diyPersonaSummaryName"></b></div>
					<p id="diyPersonaSummaryDescription" style="margin-top:0; margin-bottom:10px;"></p>
					<div id="diyPersonaFacetSummary"></div>
				</div>
			</div>
		</div>
	</body>
